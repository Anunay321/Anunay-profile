<body>
<canvas id="gl" aria-label="Interactive solar system. Drag to rotate, pinch or scroll to zoom, tap a planet to focus."></canvas>
<div id="labels"></div>
<div id="fallback">This page needs WebGL. Try a recent version of Chrome, Safari, or Firefox.</div>
<div id="load"><div class="spinner" style="position:relative"></div><span>Building the solar systemâ€¦</span></div>

<nav class="nav" aria-label="Controls">

    <button id="bOver">Overview</button>
    <button id="bOrb" aria-pressed="true">Orbits</button>
    <button id="bLab" aria-pressed="true">Labels</button>
  </div>
</nav>

<div class="hint" id="hint"><b>Drag</b> to rotate &middot; <b>pinch or scroll</b> to zoom &middot; <b>tap</b> a planet<br>Sizes and distances are compressed to fit on screen.</div>

<div class="dock">
  <div class="card glass" id="card"></div>
  <div class="time glass">
    <span>Time</span>
    <input id="speed" type="range" min="0" max="100" value="25" aria-label="Simulation speed">
    <output id="speedOut">10 days/s</output>
    <button id="bPause">Pause</button>
    <button id="bCinematic">Cinematic</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
